name: Daily Sync to Main

on:
  schedule:
    - cron: '0 2 * * *'   # runs once daily at 2:00 AM UTC
  workflow_dispatch:        # also allow manual trigger from Actions tab

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: Production-main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements-ci.txt

      - name: Run DB migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: ci-migration-placeholder-secret-key-min-length

      - name: Merge Production-main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main Production-main
          git checkout main
          git pull origin main
          git merge origin/Production-main -m "chore: daily sync Production-main to main for Vercel"
          git push origin main
