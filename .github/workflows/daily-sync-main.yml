name: Daily Sync to Main

on:
  schedule:
    - cron: '0 2 * * *'   # runs once daily at 2:00 AM UTC
  workflow_dispatch:        # also allow manual trigger from Actions tab

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Sync main to Production-main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # Force main to match Production-main exactly.
          # Using --force-with-lease instead of --ff-only so PR merge commits
          # that accumulate on main (and diverge from Production-main) don't
          # block the sync.
          git push --force-with-lease origin origin/Production-main:refs/heads/main
