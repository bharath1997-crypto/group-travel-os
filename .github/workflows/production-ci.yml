name: Production CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy group-travel-os-api \
            --source . \
            --region asia-south1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --min-instances=1 \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_PLACES_KEY=GOOGLE_PLACES_KEY:latest,DUFFEL_API_KEY=DUFFEL_API_KEY:latest,EVENTBRITE_TOKEN=EVENTBRITE_TOKEN:latest" \
            --update-env-vars=^##^ENVIRONMENT=production##DEBUG=False##FRONTEND_URL=https://rovvy.app##API_PUBLIC_URL=https://group-travel-os-api-704551807369.asia-south1.run.app##ALLOWED_ORIGINS=https://rovvy.app,https://www.rovvy.app,https://group-travel-os.vercel.app,http://localhost:3000
